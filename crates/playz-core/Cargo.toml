[package]
name = "playz-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
ts-rs.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
rusqlite_migration = "=2.6.0"
directories = "=6.0.0"
fs2 = "=0.4.3"
tempfile = "=3.27.0"
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "=1.11.0"
