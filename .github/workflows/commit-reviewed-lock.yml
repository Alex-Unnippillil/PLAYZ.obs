name: Commit reviewed slider lock once
on:
  push:
    branches: [work/stack-review-studio]
    paths: [.github/workflows/commit-reviewed-lock.yml]
permissions:
  contents: read
jobs:
  reviewed-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/stack-review-studio'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.6.0
      - name: Reproduce the reviewed lock byte for byte, then fast-forward only this branch
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          echo '05418bd1739097bd766f0611b4ec0890b6dd7a2d786d52f25cf6e369119defad  pnpm-lock.yaml' | sha256sum --check
          test "$(git hash-object pnpm-lock.yaml)" = e1d054f19e1c9a5958d5616637feee1e243a7f0f
          test "$(git diff --name-only)" = pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git commit -m 'build: lock reviewed Radix Slider 1.4.7 dependency graph'
          git push origin HEAD:refs/heads/work/stack-review-studio
