name: UI interaction and accessibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - name: Generate renderer-only media fixture
        run: |
          # Development-only distro tool. The shipped Windows FFmpeg remains pinned separately.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=960x540:rate=30 -t 4 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart apps/desktop/dist/fixture.mp4
      - name: Browser interaction, reflow and axe checks
        run: pnpm --dir apps/desktop exec playwright test --config playwright.ui.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-evidence-${{ github.sha }}
          path: |
            artifacts/ui-report/
            artifacts/ui-results/
          retention-days: 14
