name: Core verification
on:
  push:
    branches: [main, work/local-recorder]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive exact reviewed sources
        run: git archive --format=zip --output=playz-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playz-source-${{ github.sha }}
          path: playz-source.zip
          retention-days: 7
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust domain, persistence and protocol tests
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test -p playz-core --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          cargo run -p playz-core --locked --bin generate-contracts
          if ($LASTEXITCODE -ne 0) { throw 'Contract generation failed' }
          ./scripts/test-exports.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-contracts-${{ matrix.os }}
          path: apps/desktop/src/contracts.ts
          retention-days: 7
