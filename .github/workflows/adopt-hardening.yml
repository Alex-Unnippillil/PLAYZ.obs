# One-time maintainer edit adoption. Tests run later against its immutable commit.
name: Adopt reviewed hardening changes
on:
  push:
    branches: [work/local-recorder]
    paths: [.github/workflows/adopt-hardening.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Alex-Unnippillil/PLAYZ.obs' && github.actor == 'Alex-Unnippillil'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/local-recorder
      - name: Verify and apply the explicitly reviewed patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('scripts/reviewed-hardening.patch')
          data=p.read_bytes().replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(data).hexdigest() == 'debc7f69bf0d8fea99e13e51eb730f6e9abc9615a93d242692debeb20204a540'
          p.write_bytes(data)
          PY
          git apply --check scripts/reviewed-hardening.patch
          git apply --index scripts/reviewed-hardening.patch
          cargo fmt --all
          git add -- .github/workflows/assemble.yml crates/playz-core/src/contracts.rs crates/playz-core/src/core.rs crates/playz-core/src/media.rs crates/playz-core/src/paths.rs scripts/bootstrap.ps1 crates/playz-core/tests/capture_pipeline.rs crates/playz-core/tests/export_safety.rs crates/playz-core/tests/media_pipeline.rs
          git rm -f -- scripts/reviewed-hardening.patch .github/workflows/adopt-hardening.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(core): reject ambiguous exports and unsafe relinks; validate Windows filenames'
          git push origin HEAD:work/local-recorder
