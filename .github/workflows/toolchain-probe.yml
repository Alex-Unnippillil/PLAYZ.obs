name: Toolchain inspection
on:
  push:
    branches: [work/local-recorder]
    paths: [.github/workflows/toolchain-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Inspect official registries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          rustc --version
          $packages = @('react','react-dom','typescript','vite','@vitejs/plugin-react','vitest','@testing-library/react','@testing-library/jest-dom','@testing-library/user-event','jsdom','@types/react','@types/react-dom','@types/node','@tauri-apps/api','@tauri-apps/cli','@tanstack/react-query','@tanstack/react-virtual','lucide-react','zod','react-hook-form','@hookform/resolvers','tailwindcss','@tailwindcss/vite','@radix-ui/react-dialog','@radix-ui/react-slot','class-variance-authority','clsx','tailwind-merge','pnpm','@playwright/test','@axe-core/playwright')
          $versions = [ordered]@{}
          foreach ($p in $packages) {
            $v = npm view $p version
            if ($LASTEXITCODE -ne 0) { throw "Registry inspection failed for $p" }
            $versions[$p] = "$v".Trim()
          }
          $versions | ConvertTo-Json | Tee-Object -FilePath versions.json
          npm view pnpm@12.6.0 engines --json
          Invoke-RestMethod 'https://nodejs.org/dist/index.json' | Select-Object -First 5 version,lts | ConvertTo-Json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inspected-frontend-versions
          path: versions.json
          retention-days: 7
