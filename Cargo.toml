[workspace]
members = ["crates/playz-core", "apps/desktop/src-tauri"]
default-members = ["crates/playz-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "io-util", "time"] }
thiserror = "=2.0.20"
tracing = "=0.1.44"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
